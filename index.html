<script>
  // Thème et animations choisis sur CET appareil (Réglages), appliqués AVANT l'affichage
  // pour éviter un « flash » blanc. En « auto », on suit le téléphone / PC, même s'il change en route.
  (function () {
    var r = {};
    try { r = JSON.parse(localStorage.getItem("etc-reglages")) || {}; } catch (e) { /* stockage bloqué */ }
    var choix = r.theme || "auto";
    var sombreTel = matchMedia("(prefers-color-scheme: dark)");
    function appliquer() {
      var t = choix === "auto" ? (sombreTel.matches ? "sombre" : "clair") : choix;
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]').content = t === "sombre" ? "#171c24" : "#f3f1ea";
    }
    appliquer();
    sombreTel.addEventListener("change", appliquer);
    window.appliquerTheme = function (nouveau) { choix = nouveau; appliquer(); };
    if (r.anim === "simples") document.documentElement.classList.add("anim-simples");
  })();
</script>
</head>
